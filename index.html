<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>الموقع متوقف حالياً</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0b1120 0%, #050811 100%);
      color: #f8fafc;
      text-align: center;
    }
    .box {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 36px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .icon { font-size: 3rem; margin-bottom: 14px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; color: #f87171; }
    p { font-size: 0.96rem; color: #cbd5e1; line-height: 1.8; }
  </style>
</head>
<body>
  <main class="box">
    <div class="icon">⛔</div>
    <h1>تم تعطيل استضافة الموقع</h1>
    <p>هذا الموقع متوقف حالياً ولا يمكن الوصول إليه.</p>
  </main>
</body>
</html>
